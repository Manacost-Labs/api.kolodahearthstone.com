services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        # scripts/deploy-server.sh передаёт полный SHA origin/main и
        # проверяет label после сборки. Ручная сборка честно получает unknown.
        org.opencontainers.image.revision: ${HS_IMAGE_REVISION:-unknown}
        org.opencontainers.image.source: https://github.com/Manacost-Labs/api.kolodahearthstone.com
    image: hs-data-api:local
    container_name: hs-data-api
    restart: unless-stopped
    env_file:
      - path: ${HS_RUNTIME_ENV_FILE:-./.env.docker}
        required: true
      - path: ${HS_OPENROUTER_ENV_FILE:-/home/debian/server/secrets/hs-data-api/openrouter.env}
        required: false
      # Balance Radar: REDDITAPIS_API_KEY, GETXAPI_API_KEY, ANTHROPIC_API_KEY,
      # RADAR_ANALYSIS_MODEL. Without it the radar job fails; the API still runs.
      - path: ${HS_RADAR_ENV_FILE:-/home/debian/server/secrets/hs-data-api/radar.env}
        required: false
      - path: ${HS_GRAPHQL_ENV_FILE:-/home/debian/server/secrets/hs-data-api/graphql.env}
        required: false
      - path: ${HS_META_LAB_ENV_FILE:-/etc/hs-data-api-meta-lab.env}
        required: false
      - path: ${HS_DECODO_ENV_FILE:-/home/debian/.config/hs-data-api/decodo.env}
        required: false
    environment:
      HS_API_BIND_HOST: "0.0.0.0"
      HS_API_PORT: "8000"
      HS_FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
      HS_CLOAKBROWSER_DISPLAY: ":99"
      # Persisted parser-control policy is authoritative. The legacy dated
      # environment fallback stays disabled so an old patch cannot reactivate.
      HS_ARENA_POST_PATCH_ENABLED: "false"
      # Expansion release: accept volume/fill drops. Restore 0.30 to block them.
      HS_DATASET_REGRESSION_DROP_RATIO: "1.0"
      DISPLAY: ":99"
    volumes:
      - ./data:/var/lib/hs-data-api
    ports:
      - "127.0.0.1:18081:8000"
    depends_on:
      flaresolverr:
        condition: service_started
    shm_size: "4gb"
    mem_limit: "12g"
    cpus: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - default
      - hs-data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: hs-flaresolverr-docker
    restart: unless-stopped
    environment:
      # Info-level FlareSolverr logs may include complete request bodies and
      # authentication cookies. Production-safe logging must stay at warning.
      LOG_LEVEL: warning
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: Europe/Warsaw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: "4gb"
    mem_limit: "6g"
    cpus: 4

networks:
  hs-data:
    external: true
    name: hs-data_default
