name: hs-data

services:
  postgres:
    image: postgres:17.10
    env_file: docker.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:15434:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: nocodb_postgres_data
