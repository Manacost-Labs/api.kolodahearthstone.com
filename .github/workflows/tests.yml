name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that PR's previous run; runs on main
# get a unique group and are never cancelled.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-exporter-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "pytest>=9,<10"
      - run: python -c "from app.systemd_timer_export import build_host_timer_snapshot, write_host_timer_snapshot"
      - run: python -m pytest -q tests/test_parser_control_systemd_runtime.py tests/test_parser_control_schedule_inventory.py

  # `make check` split in two parallel jobs: together they run exactly the
  # commands of `make check` (see Makefile).
  check-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            panel/requirements.txt
      - name: Install dependencies
        # pytest runs php (tests/test_shadow_radar_transaction.py); nothing
        # else from the tool chain is used by tests/.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli
          pip install -r requirements-dev.txt -r panel/requirements.txt
          command -v php
      - name: pytest (make check-python)
        run: make check-python PYTHON="$(command -v python)"

  check-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            panel/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            panel-next/package-lock.json
            sdks/typescript/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install dependencies
        # imagemagick: panel image scripts; php-cli: panel and platform tests;
        # ripgrep: panel/tests/runtime_layout_test.sh.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick php-cli ripgrep
          pip install -r requirements-dev.txt -r panel/requirements.txt
          command -v php
      - name: Install actionlint 1.7.12
        # Release binary with a pinned checksum (actionlint_1.7.12_checksums.txt
        # of https://github.com/rhysd/actionlint/releases/tag/v1.7.12).
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          sudo install -m 0755 "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
          actionlint -version
      - name: Tools gate (make check-tools)
        run: make check-tools PYTHON="$(command -v python)"

  platform-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: make platform-migrations-check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build --no-cache --tag hs-data-api:ci .

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: npm ci --ignore-scripts
        working-directory: sdks/typescript
      - run: npm run check
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      - run: npm pack --dry-run
        working-directory: sdks/typescript
      - run: npm audit --audit-level=high
        working-directory: sdks/typescript
      - run: dotnet format KolodaHearthstone.Api.SmokeTests/KolodaHearthstone.Api.SmokeTests.csproj --verify-no-changes
        working-directory: sdks/dotnet
      - run: dotnet build KolodaHearthstone.Api.SmokeTests/KolodaHearthstone.Api.SmokeTests.csproj --configuration Release
        working-directory: sdks/dotnet
      - run: dotnet pack KolodaHearthstone.Api/KolodaHearthstone.Api.csproj --configuration Release --no-build --output ${{ runner.temp }}/packages
        working-directory: sdks/dotnet
      - run: dotnet run --project KolodaHearthstone.Api.SmokeTests/KolodaHearthstone.Api.SmokeTests.csproj --configuration Release --no-build
        working-directory: sdks/dotnet

  triggerdev-control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration/triggerdev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orchestration/triggerdev/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
