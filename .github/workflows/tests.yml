name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  host-exporter-python311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "pytest>=9,<10"
      - run: python -c "from app.systemd_timer_export import build_host_timer_snapshot, write_host_timer_snapshot"
      - run: python -m pytest -q tests/test_parser_control_systemd_runtime.py tests/test_parser_control_schedule_inventory.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Install canonical verification dependencies
        run: |
          pip install -r requirements-dev.txt -r panel/requirements.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          command -v php
      - name: Canonical project gate
        run: make check PYTHON="$(command -v python)"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build --no-cache --tag hs-data-api:ci .

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: npm ci --ignore-scripts
        working-directory: sdks/typescript
      - run: npm run check
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      - run: npm pack --dry-run
        working-directory: sdks/typescript
      - run: npm audit --audit-level=high
        working-directory: sdks/typescript
      - run: dotnet format KolodaHearthstone.Api.SmokeTests/KolodaHearthstone.Api.SmokeTests.csproj --verify-no-changes
        working-directory: sdks/dotnet
      - run: dotnet build KolodaHearthstone.Api.SmokeTests/KolodaHearthstone.Api.SmokeTests.csproj --configuration Release
        working-directory: sdks/dotnet
      - run: dotnet pack KolodaHearthstone.Api/KolodaHearthstone.Api.csproj --configuration Release --no-build --output ${{ runner.temp }}/packages
        working-directory: sdks/dotnet
      - run: dotnet run --project KolodaHearthstone.Api.SmokeTests/KolodaHearthstone.Api.SmokeTests.csproj --configuration Release --no-build
        working-directory: sdks/dotnet

  triggerdev-control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration/triggerdev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orchestration/triggerdev/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
