server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name api.kolodahearthstone.com;

    access_log /var/www/httpd-logs/api.kolodahearthstone.com.access.log;
    error_log /var/www/httpd-logs/api.kolodahearthstone.com.error.log notice;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    server_name api.kolodahearthstone.com;

    ssl_certificate /etc/letsencrypt/live/api.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kolodahearthstone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/www/httpd-logs/api.kolodahearthstone.com.access.log;
    error_log /var/www/httpd-logs/api.kolodahearthstone.com.error.log notice;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The database web panel lives on the unified hostname root. Application-
    # level GitHub auth protects panel data while the integration API remains
    # public below.
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location = /analytics.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/analytics.php;
        fastcgi_param SCRIPT_NAME /analytics.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location = /auth/github {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/auth/github.php;
        fastcgi_param SCRIPT_NAME /auth/github.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location = /auth/github/callback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/auth/github-callback.php;
        fastcgi_param SCRIPT_NAME /auth/github-callback.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    # The one-time app registration remains behind the previous password and
    # disables itself permanently as soon as the GitHub credentials exist.
    location = /auth/github/setup {
        auth_basic "Koloda Hearthstone GitHub setup";
        auth_basic_user_file /etc/nginx/auth/db.kolodahs.ru.htpasswd;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/auth/github-setup.php;
        fastcgi_param SCRIPT_NAME /auth/github-setup.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location = /auth/github/setup/callback {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/auth/github-setup-callback.php;
        fastcgi_param SCRIPT_NAME /auth/github-setup-callback.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location = /auth/logout {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/auth/logout.php;
        fastcgi_param SCRIPT_NAME /auth/logout.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;
    }

    location ^~ /auth/ {
        return 404;
    }

    location = /config.php {
        deny all;
    }

    location ^~ /lib/ {
        deny all;
    }

    location ^~ /assets/ {
        root /var/www/koloda/data/www/db.kolodahs.ru;
        limit_except GET HEAD { deny all; }
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Compatibility surface for the database API that previously lived on
    # db.kolodahs.ru. It deliberately uses the local PHP-FPM socket, so the
    # old hostname can be retired without breaking this endpoint.
    location ~ ^/api(?:/?$|/v1(?:/|$)) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/koloda/data/www/db.kolodahs.ru/api/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/var/www/php-fpm/kolodahs.ru.sock;

    }

    # All public database media remains available under the same paths on the
    # unified hostname. The directory is read-only from HTTP's perspective.
    location ^~ /uploads/ {
        root /var/www/koloda/data/www/db.kolodahs.ru;
        limit_except GET HEAD { deny all; }
        autoindex off;
        open_file_cache off;
        etag on;
        expires off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ^~ /admin/api-tokens {
        limit_req zone=koloda_api_token_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        client_max_body_size 16k;
    }

    location = /v1/auth/token {
        limit_req zone=koloda_api_token_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        client_max_body_size 20m;
    }
}
