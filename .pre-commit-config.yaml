minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: Detect staged secrets with Gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: project-check
        name: Run make check
        entry: make check
        language: system
        pass_filenames: false
        stages: [pre-push]
