# Install in /etc/nginx/conf.d/ for the public /api/v1 compatibility catalog.
fastcgi_cache_path /var/cache/nginx/koloda-rest
    levels=1:2 keys_zone=koloda_rest:10m inactive=10m max_size=256m use_temp_path=off;

map $http_cache_control $koloda_rest_refresh {
    default 0;
    ~*(no-cache|no-store|max-age=0) 1;
}

map $upstream_status $koloda_rest_no_store {
    default 1;
    200 0;
}

# Honor responses that explicitly prohibit shared caching even though the
# normal public response's five-minute TTL is overridden by our short cache.
map $upstream_http_cache_control $koloda_rest_private {
    default 0;
    ~*(private|no-store|no-cache) 1;
}
