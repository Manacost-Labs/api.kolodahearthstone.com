[Unit]
# A retry every 3 h allows at most 8 starts per day, below the burst limit,
# so repeated 429s never leave the unit stuck in start-limit-hit.
StartLimitIntervalSec=1d
StartLimitBurst=10

[Service]
# wiki.gg may answer with HTTP 429 during a large rolling refresh. The parser
# waits (Retry-After, else 60/120/240 s) and then exits with EX_TEMPFAIL (75),
# releases the global lock, and retries later.
Restart=on-failure
RestartSec=3h
